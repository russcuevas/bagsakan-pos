<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9F5FC"/>
      <stop offset="100%" stop-color="#D5ECF8"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#51B8E5"/>
      <stop offset="100%" stop-color="#075998"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#102A4E" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Subtle circles pattern -->
  <circle cx="200" cy="130" r="85" fill="#FFFFFF" opacity="0.65"/>
  <circle cx="200" cy="130" r="70" fill="url(#primaryGrad)" opacity="0.12"/>

  <!-- Stylized Fresh Produce Basket & Harvest Icons -->
  <g filter="url(#cardShadow)" transform="translate(140, 70)">
    <!-- Crate / Basket Base -->
    <path d="M15 65 L105 65 L95 105 L25 105 Z" fill="#102A4E" rx="3"/>
    <path d="M10 65 L110 65 L110 58 L10 58 Z" fill="#075998" rx="2"/>
    <line x1="40" y1="65" x2="45" y2="105" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    <line x1="60" y1="65" x2="60" y2="105" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    <line x1="80" y1="65" x2="75" y2="105" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>

    <!-- Fresh Harvest Produce (Tomato, Leaf, Grain) -->
    <!-- Tomato / Fruit -->
    <circle cx="45" cy="48" r="18" fill="#EF4444"/>
    <path d="M45 28 Q48 24 50 22 Q46 25 45 30" stroke="#059669" stroke-width="3" fill="none"/>
    <path d="M41 30 Q45 27 49 30" stroke="#10B981" stroke-width="2" fill="none"/>

    <!-- Leaf / Vegetable -->
    <path d="M65 52 C65 30 85 25 85 25 C85 45 65 52 65 52 Z" fill="url(#accentGrad)"/>
    <path d="M65 52 Q75 38 85 25" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" fill="none"/>

    <!-- Egg / Produce -->
    <ellipse cx="60" cy="50" rx="12" ry="15" fill="#FBBF24" opacity="0.95" transform="rotate(-15 60 50)"/>
  </g>

  <!-- Brand Banner Pill at bottom -->
  <rect x="120" y="222" width="160" height="28" rx="14" fill="#FFFFFF" filter="url(#cardShadow)"/>
  <text x="200" y="241" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#075998" text-anchor="middle" letter-spacing="1.5">BAGSAKAN ITEM</text>
</svg>
